server:
  port: 8083

spring:
  application:
    name: restriction-service
  datasource:
    url: jdbc:postgresql://localhost:5443/restriction
    username: restriction
    password: restriction
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      acks: all
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      properties:
        # idempotent producer keeps per-partition order even with retries and up to 5 in-flight requests
        enable.idempotence: true
        max.in.flight.requests.per.connection: 5
    consumer:
      group-id: ${spring.application.name}
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    listener:
      ack-mode: record
      concurrency: 3
      missing-topics-fatal: false
  mvc:
    problemdetails:
      enabled: true

app:
  kafka:
    partitions: 6
    replication-factor: 1
    retry-interval: 1s       # pause between blocking retries of a failed message
    max-retries: 3           # then the message goes to the dead letter topic
    topics:
      restriction-events: restriction.client-events.v1
      screening-events: screening.client-events.v1
      screening-events-dlt: screening.client-events.v1.restriction-service.dlt
  outbox:
    poll-interval-ms: 200
    batch-size: 100
    send-timeout: 10s

management:
  endpoints:
    web:
      exposure:
        include: health,info
