spring:
  datasource:
    url: jdbc:h2:mem:onboarding;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
    username: sa
    password:
  kafka:
    bootstrap-servers: ${spring.embedded.kafka.brokers}
    listener:
      concurrency: 1
app:
  kafka:
    partitions: 3
    retry-interval: 100ms
    max-retries: 1
  outbox:
    poll-interval-ms: 50
logging:
  level:
    org.apache.kafka: WARN
    kafka: WARN
    org.apache.zookeeper: WARN
    state.change.logger: WARN
