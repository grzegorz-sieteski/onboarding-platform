# Full platform: Kafka (KRaft, no ZooKeeper) + one database per service + the three services.
# Build the jars first:  mvn -q package -DskipTests
name: onboarding-platform

x-service-env: &kafka-env
  SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092

services:
  kafka:
    image: apache/kafka:3.9.1
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:29092,PLAINTEXT_HOST://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      # topics are created explicitly by their owning service
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:29092 > /dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 20

  onboarding-db:
    image: postgres:16-alpine
    ports: ["5441:5432"]
    environment: { POSTGRES_DB: onboarding, POSTGRES_USER: onboarding, POSTGRES_PASSWORD: onboarding }
    healthcheck: { test: ["CMD", "pg_isready", "-U", "onboarding"], interval: 3s, retries: 20 }

  screening-db:
    image: postgres:16-alpine
    ports: ["5442:5432"]
    environment: { POSTGRES_DB: screening, POSTGRES_USER: screening, POSTGRES_PASSWORD: screening }
    healthcheck: { test: ["CMD", "pg_isready", "-U", "screening"], interval: 3s, retries: 20 }

  restriction-db:
    image: postgres:16-alpine
    ports: ["5443:5432"]
    environment: { POSTGRES_DB: restriction, POSTGRES_USER: restriction, POSTGRES_PASSWORD: restriction }
    healthcheck: { test: ["CMD", "pg_isready", "-U", "restriction"], interval: 3s, retries: 20 }

  onboarding-service:
    build: ./onboarding-service
    ports: ["8081:8081"]
    environment:
      <<: *kafka-env
      SPRING_DATASOURCE_URL: jdbc:postgresql://onboarding-db:5432/onboarding
      # demo values so the timeout can be observed locally (production default: 15m / 30s)
      APP_SCREENING_TIMEOUT: 20s
      APP_SCREENING_CHECK_INTERVAL_MS: 2000
    depends_on:
      kafka: { condition: service_healthy }
      onboarding-db: { condition: service_healthy }

  screening-service:
    build: ./screening-service
    ports: ["8082:8082"]
    environment:
      <<: *kafka-env
      SPRING_DATASOURCE_URL: jdbc:postgresql://screening-db:5432/screening
    depends_on:
      kafka: { condition: service_healthy }
      screening-db: { condition: service_healthy }

  restriction-service:
    build: ./restriction-service
    ports: ["8083:8083"]
    environment:
      <<: *kafka-env
      SPRING_DATASOURCE_URL: jdbc:postgresql://restriction-db:5432/restriction
    depends_on:
      kafka: { condition: service_healthy }
      restriction-db: { condition: service_healthy }
