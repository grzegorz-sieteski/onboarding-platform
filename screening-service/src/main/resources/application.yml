server:
  port: 8082

spring:
  application:
    name: screening-service
  datasource:
    url: jdbc:postgresql://localhost:5442/screening
    username: screening
    password: screening
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      acks: all
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      properties:
        # idempotent producer keeps per-partition order even with retries and up to 5 in-flight requests
        enable.idempotence: true
        max.in.flight.requests.per.connection: 5
    consumer:
      group-id: ${spring.application.name}
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    listener:
      ack-mode: record
      concurrency: 3
      missing-topics-fatal: false
  mvc:
    problemdetails:
      enabled: true

app:
  kafka:
    partitions: 6
    replication-factor: 1
    topics:
      screening-events: screening.client-events.v1
      onboarding-events: onboarding.customer-events.v1
      onboarding-events-dlt: onboarding.customer-events.v1.screening-service.dlt
  outbox:
    poll-interval-ms: 200
    batch-size: 100
    send-timeout: 10s

management:
  endpoints:
    web:
      exposure:
        include: health,info
